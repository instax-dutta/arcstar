services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcstar}
      POSTGRES_DB: ${POSTGRES_DB:-arcstar}
    volumes:
      - arcstar-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcstar} -d ${POSTGRES_DB:-arcstar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-arcstar}:${POSTGRES_PASSWORD:-arcstar}@postgres:5432/${POSTGRES_DB:-arcstar}
    command: ["node", "scripts/migrate.mjs"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8787
      NODE_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-arcstar}:${POSTGRES_PASSWORD:-arcstar}@postgres:5432/${POSTGRES_DB:-arcstar}
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  arcstar-postgres:
