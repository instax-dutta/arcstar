<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Arcstar</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #root { height: 100%; }
      .layout { display: grid; grid-template-columns: 2fr 1fr; height: 100%; }
      .panel { padding: 1rem; overflow: auto; border-left: 1px solid #ccc; }
      #graph { width: 100%; height: 100%; }
      .node-item { margin-bottom: 0.5rem; }
      .evidence { margin-top: 1.5rem; border-top: 1px solid #ccc; padding-top: 1rem; }
      .evidence textarea { width: 100%; box-sizing: border-box; margin-bottom: 0.5rem; font-family: inherit; }
      .evidence button { margin-bottom: 0.75rem; }
      .evidence h3 { margin-bottom: 0.5rem; }
      .evidence h4 { margin: 0.75rem 0 0.25rem; }
      .claim { margin-top: 1.5rem; border-top: 1px solid #ccc; padding-top: 1rem; }
      .claim h3 { margin-bottom: 0.5rem; }
      .claim h4 { margin: 0.75rem 0 0.25rem; }
      .snapshot { font-size: 0.85rem; color: #374151; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
