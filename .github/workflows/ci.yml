name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC nightly. Off the hour on purpose: the top of the hour is the
    # most contended slot on GitHub Actions and we have no need to queue.
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The purity gate runs before tests on purpose. If someone reaches for
      # Date.now() or fetch() inside the credibility engine, we want that to be
      # the first failure, not something buried under a test run.
      - name: Purity gate (credibility engine must be I/O-free)
        run: node scripts/check-purity.mjs packages/credibility

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  benchmark:
    name: Credibility benchmark (nightly, go/no-go gate)
    runs-on: ubuntu-latest
    # PLAN.md section 6.1: AUC >= 0.80 is the project go/no-go gate. This runs
    # nightly so a regression is visible long before anyone looks at a commit.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run evaluation
        run: pnpm run eval
